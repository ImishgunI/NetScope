name: run-tests
on:
  push:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Install dependencies
        run: sudo apt install -y build-essential cmake clang-format clang-tidy

      - name: Run clang-format check 
        run: |
          clang-format --version
          find src tests -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 |
          while IFS= read -r -d '' file; do
              clang-format --style=file:../../.clang-format --dry-run --Werror "$file"
          done

      - name: Configure project
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build project
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build

      - name: Run clang-tidy 
        run: clang-tidy -p build src/*.cpp
name: run-tests
on:
  push:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Install dependencies
        run: sudo apt install -y build-essential cmake clang-tidy wget gnupg

      - name: Run clang-format check
        uses: jidicula/clang-format-action@v4
        with:
          clang-format-version: '22'
          check-path: 'src'

      - name: Configure project
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build project
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build

      - name: Run clang-tidy 
        run: clang-tidy -p build src/*.cpp